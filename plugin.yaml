name: story-construction
version: 0.1.0
description: "Obsidian-backed story construction workspace for Hermes Desktop."
author: mzyas
kind: backend
requires_hermes: ">=0.21.5"
provides_tools:
  - story.get_session_project
  - story.propose_edit
  - story.propose_new
  - story.propose_rename
  - story.propose_delete
  - story.apply_edit
  - story.list_records
  - story.get_record
  - story.get_project
  - story.get_world_info
  - story.search_world_info
  - story.get_character
  - story.list_volumes
  - story.list_chapters
  - story.get_chapter
  - story.search_notes
  - story.search_reference_notes
provides_hooks:
  - pre_tool_call
