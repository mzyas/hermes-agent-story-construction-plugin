name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The integration tests import a read-only Hermes source checkout.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: astral-sh/setup-uv@v5
      - name: Run pytest
        env:
          HERMES_SOURCE: ${{ github.workspace }}/hermes-agent
          # Fail instead of silently skipping the integration tests.
          REQUIRE_HERMES: "1"
        run: uv run --frozen --with pytest --with ruamel.yaml pytest tests -q

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run desktop tests
        run: node --test desktop/*.test.mjs
