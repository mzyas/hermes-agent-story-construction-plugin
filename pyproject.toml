[project]
name = "hermes-story-construction-plugin"
version = "0.1.1"
description = "Hermes story construction plugin with Obsidian-backed project context."
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi>=0.133.1,<0.135", "pyyaml>=6.0,<7"]

[dependency-groups]
test = ["pytest>=8.3,<10", "ruamel.yaml>=0.18.16,<1"]

[tool.uv]
# Release quarantine: skip versions published in the last 14 days.
exclude-newer = "14 days"

[tool.ruff]
target-version = "py311"
# CI clones the Hermes source here for the integration tests.
extend-exclude = ["hermes-agent"]

[tool.ruff.lint]
# Ruff's default rule set, pinned so a user-level config can't widen it.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
